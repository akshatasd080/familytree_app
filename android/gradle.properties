org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.useSystemProxies=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Avoid Kotlin incremental-cache corruption on Windows paths with spaces
# (e.g. "D:\kiosk app\...": "Storage is already registered" / Could not close incremental caches)
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.workers.max=2
systemProp.java.net.useSystemProxies=false
